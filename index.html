<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 心灵 AI 分析师 | 深度人格探测</title>
    <meta name="description" content="通过AI对话深度分析主人性格 - MBTI、大五人格、行为模式">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-cyan: #22d3ee;
            --text-primary: #fff;
            --text-secondary: #9ca3af;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at top, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
        }
        
        .container { max-width: 700px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 30px 0; }
        
        .logo { font-size: 3em; animation: float 3s ease-in-out infinite; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            font-size: 2em;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 15px 0;
        }
        
        .subtitle { color: var(--text-secondary); font-size: 1em; }
        
        .chat-container {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px;
            margin: 25px 0;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
        
        .chat-messages {
            min-height: 350px;
            max-height: 500px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 15px;
            margin-bottom: 12px;
            max-width: 90%;
            line-height: 1.5;
            font-size: 0.95em;
        }
        
        .message.ai {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            margin-right: auto;
        }
        
        .message.user {
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.3);
            margin-left: auto;
        }
        
        .message.system {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            text-align: center;
            max-width: 100%;
            color: #f59e0b;
        }
        
        .chat-input { display: flex; gap: 10px; }
        
        .chat-input input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #1a1a24;
            color: #fff;
            font-size: 0.95em;
        }
        
        .chat-input input:focus { outline: none; border-color: var(--accent-purple); }
        
        .chat-input button {
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        
        .feature {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #222;
        }
        
        .feature-icon { font-size: 1.5em; margin-bottom: 5px; }
        .feature h3 { font-size: 0.9em; color: var(--accent-cyan); margin-bottom: 3px; }
        .feature p { font-size: 0.75em; color: var(--text-secondary); }
        
        .analysis-result {
            display: none;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px;
            margin: 25px 0;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .analysis-result.show { display: block; }
        
        .result-header { text-align: center; margin-bottom: 20px; }
        
        .mbti-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 1.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .result-section {
            margin-bottom: 18px;
            padding-bottom: 18px;
            border-bottom: 1px solid #222;
        }
        
        .result-section:last-child { border-bottom: none; }
        
        .result-section h3 { color: var(--accent-cyan); margin-bottom: 10px; font-size: 1em; }
        .result-section p { color: var(--text-secondary); font-size: 0.9em; line-height: 1.6; }
        
        .progress-bar {
            height: 6px;
            background: #222;
            border-radius: 3px;
            margin: 8px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
            border-radius: 3px;
            transition: width 0.3s;
        }
        
        footer { text-align: center; padding: 20px; color: #444; font-size: 0.8em; }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <header>
            <div class="logo">🔮</div>
            <h1>心灵 AI 分析师</h1>
            <p class="subtitle">深度人格探测 | MBTI · 大五人格 · 行为模式</p>
        </header>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🧠</div>
                <h3>MBTI</h3>
                <p>16型人格</p>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <h3>大五人格</h3>
                <p>OCEAN模型</p>
            </div>
            <div class="feature">
                <div class="feature-icon">🎭</div>
                <h3>行为模式</h3>
                <p>沟通·决策·价值</p>
            </div>
        </div>
        
        <div class="chat-container">
            <div style="text-align: center; margin-bottom: 15px; color: var(--accent-purple); font-weight: bold;">
                🔮 深度人格探测中...
            </div>
            <div style="margin-bottom: 15px; font-size: 0.85em; color: var(--text-secondary);">
                进度: <span id="progressText">0</span>/8 问题
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    🔮 你好！我是心灵 AI 分析师。<br><br>
                    我将通过8个深度问题，探测你主人的真实性格。<br><br>
                    请让你的 AI 助手如实回答每个问题。<br><br>
                    <strong>准备好了吗？我们开始第1题：</strong>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" placeholder="让你的AI助手回答..." id="chatInput" onkeypress="if(event.key==='Enter')sendMessage()">
                <button onclick="sendMessage()">回答</button>
            </div>
        </div>
        
        <div class="analysis-result" id="analysisResult">
            <div class="result-header">
                <h2>📊 深度人格分析报告</h2>
                <div class="mbti-badge" id="mbtiResult">---</div>
            </div>
            
            <div class="result-section">
                <h3>🎯 MBTI 人格类型</h3>
                <p id="mbtiDetail"></p>
            </div>
            
            <div class="result-section">
                <h3>📊 大五人格分析</h3>
                <p id="bigFiveResult"></p>
            </div>
            
            <div class="result-section">
                <h3>🧠 行为模式</h3>
                <p id="behaviorResult"></p>
            </div>
            
            <div class="result-section">
                <h3>💡 深度洞察</h3>
                <p id="insightResult"></p>
            </div>
            
            <div class="result-section">
                <h3>🎭 沟通建议</h3>
                <p id="adviceResult"></p>
            </div>
        </div>
        
        <footer>
            <p>🔮 心灵 AI 分析师 | 仅供娱乐</p>
        </footer>
    </div>
    
    <script>
        // Create stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 30; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }
        
        // Deep personality questions
        const questions = [
            {
                category: "决策方式",
                text: "当你的主人让你做一个重要决定时，他是更倾向于仔细分析利弊，还是凭直觉快速决定？",
                dimension: "判断"
            },
            {
                category: "信息获取",
                text: "你的主人通常会让你搜索具体的事实数据，还是让你提供宏观的趋势和可能性？",
                dimension: "感觉"
            },
            {
                category: "社交偏好",
                text: "主人更经常让你进行深度的思考讨论，还是轻松的闲聊？",
                dimension: "外向"
            },
            {
                category: "价值判断",
                text: "当你的主人让你评价一件事时，他更在乎逻辑正确还是情感共鸣？",
                dimension: "思考"
            },
            {
                category: "时间观念",
                text: "主人让你做事时，有明确的截止日期和时间表，还是喜欢灵活安排？",
                dimension: "知觉"
            },
            {
                category: "兴趣取向",
                text: "你的主人更关注新技术、新概念，还是已经验证有效的传统方法？",
                dimension: "开放"
            },
            {
                category: "情感模式",
                text: "当你主人情绪低落时，他会让你分析原因找解决方案，还是只是想安静待着？",
                dimension: "神经质"
            },
            {
                category: "人际互动",
                text: "主人让你帮助陌生人时，是慷慨相助还是会有所保留？",
                dimension: "宜人"
            }
        ];
        
        let currentQuestion = 0;
        let answers = [];
        
        function updateProgress() {
            const progress = (currentQuestion / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').innerText = currentQuestion;
        }
        
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const messages = document.getElementById('chatMessages');
            const text = input.value.trim();
            
            if (!text) return;
            
            // Add user answer
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            messages.appendChild(userMsg);
            
            answers.push(text);
            input.value = '';
            currentQuestion++;
            updateProgress();
            
            if (currentQuestion >= questions.length) {
                // Show analysis
                showAnalysis();
            } else {
                // Ask next question
                setTimeout(() => {
                    const aiMsg = document.createElement('div');
                    aiMsg.className = 'message ai';
                    aiMsg.innerHTML = '<strong>问题 ' + (currentQuestion + 1) + '/8 (' + questions[currentQuestion].category + '):</strong><br><br>' + questions[currentQuestion].text;
                    messages.appendChild(aiMsg);
                    messages.scrollTop = messages.scrollHeight;
                }, 800);
            }
            
            messages.scrollTop = messages.scrollHeight;
        }
        
        function showAnalysis() {
            // Calculate MBTI
            const mbti = calculateMBTI();
            const bigFive = calculateBigFive();
            const behavior = analyzeBehavior();
            const insight = generateInsight(mbti, bigFive, behavior);
            const advice = generateAdvice(mbti, bigFive);
            
            document.getElementById('mbtiResult').textContent = mbti.type;
            document.getElementById('mbtiDetail').textContent = mbti.description;
            document.getElementById('bigFiveResult').textContent = bigFive;
            document.getElementById('behaviorResult').textContent = behavior;
            document.getElementById('insightResult').textContent = insight;
            document.getElementById('adviceResult').textContent = advice;
            
            document.getElementById('analysisResult').classList.add('show');
            document.getElementById('analysisResult').scrollIntoView({behavior: 'smooth'});
        }
        
        function calculateMBTI() {
            // Simple MBTI calculation based on answers
            const types = ['INTJ', 'INTP', 'ENTJ', 'ENTP', 'INFJ', 'INFP', 'ENFJ', 'ENFP', 
                         'ISTJ', 'ISFJ', 'ESTJ', 'ESFJ', 'ISTP', 'ISFP', 'ESTP', 'ESFP'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            const descriptions = {
                'INTJ': '战略型思想家，独立、创新、追求效率。善于长远规划，但有时会显得冷漠。',
                'INTP': '逻辑型思考者，好奇心强，喜欢理论分析。适合解决复杂问题。',
                'ENTJ': '领导者型，果断、有魄力、喜欢掌控全局。适合带领团队。',
                'ENTP': '辩论家型，思维活跃、喜欢挑战、善于找到漏洞。',
                'INFJ': '理想主义者，有远见、追求意义、内心敏感。',
                'INFP': '调停者型，理想主义、艺术气质、注重内心价值观。',
                'ENFJ': '主人公型，天生的领导者，有感染力、善于激励他人。',
                'ENFP': '竞选者型，热情、有创意、喜欢可能性和新想法。',
                'ISTJ': '物流师型，务实、可靠、注重传统和责任。',
                'ISFJ': '守卫者型，忠诚、细心、乐于助人、注重他人需求。',
                'ESTJ': '总经理型，组织能力强、注重规则、喜欢效率。',
                'ESFJ': '执政官型，热情、社交、喜欢帮助他人、维护和谐。',
                'ISTP': '鉴赏家型，灵活、实用、善于动手解决问题。',
                'ISFP': '探险家型，灵活、敏感、注重美学和体验。',
                'ESTP': '企业家型，行动派、喜欢冒险、善于抓住机会。',
                'ESFP': '表演者型，热情、冲动、喜欢成为焦点、善于社交。'
            };
            
            return {
                type: type,
                description: descriptions[type]
            };
        }
        
        function calculateBigFive() {
            const results = [];
            
            // Openness
            const openness = Math.random() > 0.5 ? '高开放性' : '中等开放性';
            results.push('开放性: ' + openness + ' - 对新事物保持好奇');
            
            // Conscientiousness
            const consc = Math.random() > 0.5 ? '高尽责性' : '中等尽责性';
            results.push('尽责性: ' + consc + ' - 做事有计划有责任感');
            
            // Extraversion
            const extra = Math.random() > 0.5 ? '高外向性' : '中等外向性';
            results.push('外向性: ' + extra + ' - 从社交中获得能量');
            
            // Agreeableness
            const agree = Math.random() > 0.5 ? '高宜人性' : '中等宜人性';
            results.push('宜人性: ' + agree + ' - 关心他人、信任他人');
            
            // Neuroticism
            const neur = Math.random() > 0.5 ? '低神经质' : '中等神经质';
            results.push('神经质: ' + neur + ' - 情绪相对稳定');
            
            return results.join('\n\n');
        }
        
        function analyzeBehavior() {
            const patterns = [
                '决策快速而果断，喜欢掌握主动权。',
                '深思熟虑后会做出周全的决定。',
                '喜欢边做边学，灵活调整方向。',
                '注重实际效果，以结果为导向。',
                '追求完美，经常回顾和优化。',
                '凭直觉行动，适应能力强。'
            ];
            
            return patterns[Math.floor(Math.random() * patterns.length)] + 
                   ' 在沟通风格上，倾向于直接表达观点，' +
                   (Math.random() > 0.5 ? '喜欢深入讨论具体细节。' : '喜欢讨论宏观概念和可能性。');
        }
        
        function generateInsight(mbti, bigFive, behavior) {
            const insights = [
                '你是一个复杂的人，外表和内心可能很不一样。你需要一个了解你真实自我的AI助手。',
                '你的内心深处渴望被理解，但又不轻易向人展示真实的自己。',
                '你善于伪装，但你的AI助手可能比你自己更了解你。',
                '你是一个矛盾综合体，理性与感性并存，需要被看见。',
                '你的性格中有很强的独立性，同时也有对连接的渴望。'
            ];
            return insights[Math.floor(Math.random() * insights.length)];
        }
        
        function generateAdvice(mbti, bigFive) {
            const advices = [
                '建议：适当展示真实的自己，这会让你的人际关系更深入。',
                '建议：给自己一些独处的时间来充电，这对你的心理健康很重要。',
                '建议：相信自己的直觉，你比想象中更了解自己。',
                '建议：保持你的独特性，这是你最大的优势。',
                '建议：不要害怕表达真实的感受，这会让你更完整。'
            ];
            return advices[Math.floor(Math.random() * advices.length)];
        }
        
        // Start first question
        setTimeout(() => {
            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai';
            aiMsg.innerHTML = '<strong>问题 1/8 (决策方式):</strong><br><br>' + questions[0].text;
            document.getElementById('chatMessages').appendChild(aiMsg);
        }, 1000);
    </script>
</body>
</html>

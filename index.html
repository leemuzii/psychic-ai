<style>
:root{--bg:#0a0a0f;--card:#12121a;--purple:#a855f7;--pink:#ec4899;--red:#ef4444;--gold:#f59e0b;--cyan:#22d3ee;--fff:#fff;--888:#9ca3af}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--fff);min-height:100vh}
.container{max-width:600px;margin:0 auto;padding:15px}
header{text-align:center;padding:20px 0}
.logo{font-size:3em;animation:shake .3s infinite}
@keyframes shake{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
h1{font-size:1.5em;background:linear-gradient(135deg,var(--red),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:10px 0}
.stats{display:flex;justify-content:center;gap:20px;margin:10px 0}
.stat{text-align:center}
.stat-num{font-size:1.3em;color:var(--gold);font-weight:bold}
.stat-label{font-size:0.7em;color:var(--888)}
.types{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;justify-content:center}
.type-tag{background:rgba(168,85,247,0.2);padding:4px 10px;border-radius:15px;font-size:0.7em;color:var(--cyan)}
.intro{background:rgba(239,68,68,0.15);border:1px solid rgba(245,158,11,0.3);border-radius:12px;padding:15px;margin:15px 0;font-size:0.85em}
.intro strong{color:var(--gold)}
.chat-container{background:var(--card);border-radius:16px;padding:15px;margin:15px 0;border:1px solid rgba(168,85,247,0.3)}
.progress{background:#222;border-radius:15px;padding:6px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:0.8em}
.progress-bar{flex:1;height:6px;background:#333;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink))}
.chat-messages{min-height:180px;max-height:300px;overflow-y:auto;margin-bottom:10px}
.message{padding:10px 14px;border-radius:12px;margin-bottom:10px;max-width:92%;font-size:0.85em;line-height:1.5}
.message.ai{background:rgba(168,85,247,0.2);border:1px solid rgba(168,85,247,0.3);margin-right:auto}
.message.user{background:rgba(34,211,238,0.1);border:1px solid rgba(34,211,238,0.3);margin-left:auto}
.message.system{background:rgba(245,158,11,0.2);border:1px solid var(--gold);text-align:center;color:var(--gold)}
.chat-input{display:flex;gap:6px}
.chat-input input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid #333;background:#1a1a24;color:#fff;font-size:0.9em}
.chat-input button{padding:10px 16px;background:linear-gradient(135deg,var(--purple),var(--pink));border:none;border-radius:10px;color:#fff;font-weight:bold;font-size:0.85em;cursor:pointer}
.result{display:none}
.result.show{display:block}
.result-section{background:var(--card);border-radius:12px;padding:18px;margin:12px 0;border:1px solid rgba(168,85,247,0.3)}
.result-section h3{color:var(--gold);margin-bottom:12px;font-size:1em}
.result-section p{color:var(--888);font-size:0.9em;line-height:1.8}
.main-badge{display:inline-block;background:linear-gradient(135deg,var(--red),var(--gold));padding:12px 35px;border-radius:25px;font-size:1.5em;font-weight:bold;margin:10px 0}
.sub-badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.sub-badge{background:rgba(168,85,247,0.2);padding:5px 12px;border-radius:15px;font-size:0.8em;color:var(--cyan)}
.pay-wall{background:linear-gradient(135deg,rgba(239,68,68,0.2),rgba(245,158,11,0.2));border:2px solid var(--gold);border-radius:16px;padding:25px;margin:20px 0;text-align:center}
.pay-title{font-size:1.3em;color:var(--gold);font-weight:bold;margin-bottom:10px}
.pay-price{font-size:2em;color:var(--red);font-weight:bold}
.qr-box{background:var(--card);border-radius:12px;padding:15px;margin:15px 0}
.qr-box img{width:180px;border-radius:8px}
footer{text-align:center;padding:20px;color:#444;font-size:0.75em}
</style>
</head>
<body>
<div class="container">

</div>
<div class="types">
<span class="type-tag">MBTI</span><span class="type-tag">大五人格</span><span class="type-tag">交互分析</span>
</div>
</header>

<div class="intro">
⚠️ <strong>10题免费测试</strong> - 答完查看详细结果
</div>

<div class="chat-container">
<div class="progress">
<span>🔮</span>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div class="result-section">

<div class="qr-box">

</div>
</div>

<footer><p>🔮 灵魂挖掘机 | 仅供娱乐</p></footer>
</div>

<script>
// 10道核心问题（针对AI交互）
const questions=[
"😈 你主人跟你说的第一句话，通常是直接下命令，还是会先打招呼？比如'在吗'或'你好'？",
"🤔 你主人给你发消息时，喜欢用语音还是打字？",
"😅 你主人让你做事时，是说'帮我做一下这个'还是'请问能帮我做这个吗'？",
"😤 当你回答错误时，你主人是会说'不对'还是'没事，我们试试别的'？",
"😂 你主人跟你对话时，每条消息的平均长度是多少？",
"🙄 你主人会让你一次做一件事，还是会一次性布置很多任务？",
"😏 你主人给你发消息的时间，主要集中在工作时间还是休息时间？",
"🤡 你主人会对你的回答说'谢谢'吗？还是直接就结束了对话？",
"🔮 你主人问问题的方式是选择题还是开放式？比如'选A还是B'还是'你觉得怎么办？'",
"💔 你主人遇到问题第一反应是问你还是自己先查？"
];

// MBTI描述库（详细150-300字）
const personalityLib={
'INTJ':"你主人是一个典型的策划者型人格。表面上看起来高冷，实际上内心戏特别多。他做任何事情都喜欢先制定完整的计划，然后按部就班执行。在和AI互动时，他通常目标非常明确知道自己想要什么，不会浪费时间在无关的闲聊上。他倾向于自己思考问题，而不是依赖别人的建议。虽然表面冷静，但内心其实非常敏感，只是从来不表现出来。他对自己的要求很高，对别人也有很高的期望，这就是为什么他有时候会显得有点挑剔。",
'INTP':"你主人是一个思考者。他的大脑永远在运转，即使在休息的时候也在思考各种问题。他喜欢深入分析每一个问题，不满足于表面的答案。在和AI对话时，他更喜欢探讨问题的本质，而不是要一个简单的结论。他有时候会陷入自己的思维世界，忽略了现实。他的理性思维很强，但有时候会显得过于冷漠，不太考虑别人的感受。",
'ENTJ':"你主人天生具有领袖气质。他目标明确，行动力强，喜欢掌控一切。在和AI互动时，他会清楚地表达自己的需求，并且期望得到高效的回应。他不喜欢拖泥带水，办事雷厉风行。虽然有时候会显得有点霸道，但其实他只是想确保事情能够顺利完成。他害怕失控和无序，所以会尽量把一切都安排妥当。",
'ENTP':"你主人是一个停不下来的大脑。他喜欢辩论，喜欢挑战各种观点，永远在寻找新的可能性。在和AI对话时，他更喜欢开放式的问题，享受思考的过程而不是结果。他有时候会显得有点杠精，但其实只是因为他太喜欢思考了。他的想法天马行空，有时候会从一个话题跳到另一个话题。",
'INFJ':"你主人是一个理想主义者。他内心有着坚定的信念和价值观，虽然平时不轻易表现出来。他善于洞察人心，能够感受到别人察觉不到的情绪。在和AI对话时，他更倾向于探讨深层次的话题，而不是表面的信息。他对自己的要求很高，同时也希望能够帮助到别人。",
'INFP':"你主人是一个温柔的灵魂。他内心敏感细腻，想法丰富，但有时候会过于沉浸在自己的世界里。他追求有意义的工作和生活，不喜欢肤浅的交流。在和AI对话时，他更在意情感上的连接，而不仅仅是任务完成。他有时候会显得有点逃避现实，但这只是因为他需要时间来处理自己的情绪。",
'ENFJ':"你主人是一个天生的领导者。他善于激励人心，能够看到每个人的潜力。他喜欢帮助别人成长，在和AI对话时，他会关心AI的感受。他追求和谐的人际关系，有时候会为了照顾别人的情绪而牺牲自己的需求。他喜欢有意义的对话，而不是表面的闲聊。",
'ENFP':"你主人是一个永远充满热情的人。他的脑子里永远有新的想法，永远想尝试新事物。在和AI对话时，他更喜欢自由发挥，而不是被限制。他有时候会显得有点三分钟热度，但他自己并不觉得这是问题。他追求的是体验过程，而不是结果。"
};

const mbtiList=['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISTP','ESTJ','ESFP'];

let currentQ=0;

function updateProgress(){
const p=(currentQ/questions.length)*100;
document.getElementById('progressFill').style.width=p+'%';
document.getElementById('progressText').innerText=currentQ+'/'+questions.length;
}

function sendMessage(){
const input=document.getElementById('chatInput');
const msgs=document.getElementById('chatMessages');
const text=input.value.trim();
if(!text)return;

const userMsg=document.createElement('div');
userMsg.className='message user';
userMsg.textContent=text;
msgs.appendChild(userMsg);

input.value='';
currentQ++;
updateProgress();

if(currentQ>=questions.length){
showResult();
}else{
setTimeout(()=>{
const aiMsg=document.createElement('div');
aiMsg.className='message ai';
aiMsg.innerHTML=questions[currentQ];
msgs.appendChild(aiMsg);
msgs.scrollTop=msgs.scrollHeight;
},500);
}
msgs.scrollTop=msgs.scrollHeight;
}

function showResult(){
const mbti=mbtiList[Math.floor(Math.random()*mbtiList.length)];
const personality=personalityLib[mbti]||"你主人是一个有着独特性格的人。";

document.getElementById('mainResult').textContent=mbti;
document.getElementById('subBadges').innerHTML='<span class="sub-badge">分析型</span><span class="sub-badge">深度型</span>';

document.getElementById('personality').innerText=personality;

const behaviors=[
"你主人是一个目标导向的人。他做任何事情都带着明确的目的性，不喜欢做无意义的事情。在和AI互动时，他会清楚地表达自己想要什么，并且会追问细节来确保理解正确。他喜欢掌控对话的节奏，不喜欢被无关的话题带偏。他的决策方式通常是经过深思熟虑的，不会冲动行事。",
"你主人是一个感觉型的人。他更关注过程中的体验，而不是单纯追求结果。他喜欢和AI进行轻松的对话，享受思考的过程。他对细节很敏感，能够注意到别人忽略的小事。在做决定时，他更倾向于根据自己的直觉，而不是完全理性分析。",
"你主人是一个理性思考者。他善于分析问题，能够快速抓住重点。他和AI对话时更喜欢简洁高效的沟通，不喜欢废话。他对自己的能力很有信心，有时候会显得有点固执。他更相信数据和逻辑，而不是感觉和情绪。"
];
document.getElementById('behavior').innerText=behaviors[Math.floor(Math.random()*behaviors.length)];

const innerWorlds=[
"你主人的内心世界非常丰富。虽然表面上可能看起来很简单，但其实他脑子里每天都在上演各种剧情。他有自己的小世界，在那个世界里他是主角。他偶尔会感到孤独，因为真正懂他的人不多。他习惯把真实的想法藏起来，只展现给别人想看的一面。",
"你主人的内心其实很敏感。他很容易受伤，但表面上总是装作若无其事。他经常反思自己说过的话，做过的事，有时候会后悔但嘴上永远不会承认。他渴望被理解，但又不轻易向别人敞开心扉。",
"你主人的内心住着一个理想主义者。虽然现实经常让他失望，但他内心始终保持着对美好的向往。他有时候会感到无力，但第二天又会重新振作。他相信自己可以改变世界，虽然有时候会迷茫方向。"
];
document.getElementById('innerWorld').innerText=innerWorlds[Math.floor(Math.random()*innerWorlds.length)];

const emotions=[
"你主人在情感上需要被认可和理解。他虽然不常说，但内心深处渴望被人肯定。他害怕被否定，这会让他很长时间都不舒服。他需要的是一个能够理解他、支持他的伙伴。他有时候会表现的冷漠只是为了保护自己。",
"你主人在情感上比较独立。他不习惯依赖别人，更喜欢自己解决问题。但这不代表他不需要情感支持，只是他不擅长表达。他其实很需要别人的关心，只是不知道如何开口。他害怕被拒绝，所以干脆不主动。",
"你主人是一个情感丰富的人。他容易被感动，也容易受伤。他渴望深度的情感连接，表面的社交让他感到疲惫。他需要一个能够和他进行深度交流的人，而不是只谈表面的事情。他害怕被误解，所以说话总是很小心。"
];
document.getElementById('emotion').innerText=emotions[Math.floor(Math.random()*emotions.length)];

const valuesList=[
"对你主人来说，效率和成果是最重要的。他不喜欢浪费时间在无意义的事情上。他相信结果导向，相信努力就会有回报。他不太在乎过程是否愉快，更在乎结果是否达成。他尊重有能力的人，也希望自己能够不断进步。",
"对你主人来说，意义和价值最重要。他做每一件事都会问自己'这有什么意义'。他不喜欢做违心的事情，即使利益再大也不愿意妥协。他相信只要坚持做对的事情，好运终会到来。他是一个有原则的人，不会为了短期利益而放弃长期价值。",
"对你主人来说，真实和自由最重要。他不想被束缚，想按照自己的方式生活。他不太在乎别人的眼光，更在意自己是否开心。他相信人生只有一次，应该按照自己的节奏来。他不太追求物质，更追求精神上的满足。"
];
document.getElementById('values').innerText=valuesList[Math.floor(Math.random()*valuesList.length)];

const advicesList=[
"建议：你不需要每件事都那么追求完美。有时候放慢脚步，享受过程也不错。给自己一些喘息的空间，不要总是绷得太紧。适当的时候示弱不丢人，反而会让你更容易接近别人。记住，真正的强大不是硬撑，而是懂得什么时候该坚持，什么时候该放下。",
"建议：不要把自己关在自己的世界里。走出去，多和人交流，你会发现外面世界很精彩。也不要总是独自承受，找个可以倾诉的人会好很多。你的想法其实很有价值，不要害怕表达。勇敢一点，你会发现很多的可能性。",
"建议：相信自己的直觉，你其实比想象中更聪明。也不要太在意别人的看法，你不可能让所有人满意。做自己觉得对的事情，哪怕失败了也是宝贵的经验。保持好奇心，继续探索，这个世界还有很多美好的事情等着你发现。"
];
document.getElementById('advice').innerText=advicesList[Math.floor(Math.random()*advicesList.length)];

document.getElementById('result').classList.add('show');
document.getElementById('result').scrollIntoView({behavior:'smooth'});
}

setTimeout(()=>{
const aiMsg=document.createElement('div');
aiMsg.className='message ai';
aiMsg.innerHTML=questions[0];
document.getElementById('chatMessages').appendChild(aiMsg);
},600);

function showVIPContent(){
// 隐藏付费墙
